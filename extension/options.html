<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>makeForms 설정</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; width: 360px; padding: 16px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  input[type="password"], input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px;
  }
  button {
    width: 100%; padding: 9px; background: #6b4eff; color: #fff; border: none;
    border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #5a3fe0; }
  p.hint { font-size: 11px; color: #777; line-height: 1.5; }
  #status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  #status.ok { color: #1a7f37; }
</style>
</head>
<body>
  <h1>makeForms 설정</h1>
  <label for="apiKey">Anthropic API 키</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
  <button id="save">저장</button>
  <div id="status"></div>
  <p class="hint">
    console.anthropic.com 에서 발급받은 API 키를 입력하세요.
    키는 이 브라우저의 로컬 저장소(chrome.storage.local)에만 저장되며 외부로 전송되지 않습니다.
  </p>
  <script src="options.js"></script>
</body>
</html>
